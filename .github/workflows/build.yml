name: WRAITH WEAVE Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-vst3.yml'
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Visual Studio 2022 x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target WRAITH_WEAVE_VST3 --parallel 4
      - name: Stage VST3
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path build -Recurse -Directory -Filter '*.vst3' | Where-Object { Test-Path (Join-Path $_.FullName 'Contents\x86_64-win') } | Select-Object -First 1
          if (-not $found) { throw 'No .vst3 bundle produced' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $found.FullName -Destination artifact -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: WRAITH-WEAVE-0.1-Windows-VST3
          path: artifact/
          if-no-files-found: error
